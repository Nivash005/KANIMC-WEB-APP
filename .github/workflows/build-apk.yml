name: Build Android Tablet APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'src/main/resources/static/**'
      - 'index.html'
      - 'gh_pages_adapter.js'
      - 'modal_logic.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Tablet APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Sync Latest Web Assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r src/main/resources/static/* android/app/src/main/assets/www/
          cp index.html android/app/src/main/assets/www/index.html
          cp gh_pages_adapter.js android/app/src/main/assets/www/gh_pages_adapter.js
          cp modal_logic.js android/app/src/main/assets/www/modal_logic.js
          echo "Assets bundled into APK:"
          ls -la android/app/src/main/assets/www/

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/kanimc-tablet.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output/kanimc-tablet.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk output/kanimc-tablet.apk
          fi
          echo "Output files:"
          ls -la output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanimc-tablet-apk
          path: output/kanimc-tablet.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-tablet
          name: "📱 KANIMC Tablet APK v1.0.0"
          body: |
            ## 📱 KANIMC Tablet Application (Android APK)
            
            This APK is fully implemented for Android Tablets and mobile devices:
            - **Complete Offline Engine**: 100% offline-ready with local IndexedDB/localStorage storage.
            - **All Masters & Registers**: Chittas, Purchases, Payments, Opening Balances, Ledger, Day Book, Cash Book, Group Master, Company Master, and Reports.
            - **Direct Android Printing**: Thermal and Wi-Fi printer support using native Android PrintManager.
            - **Wi-Fi Multi-Device Auto-Sync**: Connects directly to desktop computer server over Wi-Fi with instant real-time synchronization.
            - **Native Device Features**: Hardware acceleration, responsive layout, modal back-button navigation, and instant Excel / CSV downloads.
            
            ### 📥 Direct Download:
            Download **[kanimc-tablet.apk](https://github.com/Nivash005/KANIMC-WEB-APP/releases/download/v1.0.0-tablet/kanimc-tablet.apk)** directly onto your tablet and tap to install!
          files: output/kanimc-tablet.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
