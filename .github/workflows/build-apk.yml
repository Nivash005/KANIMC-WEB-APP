name: Build Android Tablet APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'src/main/resources/static/index.html'
      - 'src/main/resources/static/gh_pages_adapter.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Tablet APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Latest Web Assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp src/main/resources/static/index.html android/app/src/main/assets/www/index.html
          cp src/main/resources/static/gh_pages_adapter.js android/app/src/main/assets/www/gh_pages_adapter.js

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/kanimc-tablet.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output/kanimc-tablet.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk output/kanimc-tablet.apk
          fi
          echo "Output files:"
          ls -la output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanimc-tablet-apk
          path: output/kanimc-tablet.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-tablet
          name: "📱 KANIMC Tablet APK v1.0.0"
          body: |
            ## 📱 KANIMC Tablet Application (Android APK)
            
            This APK is optimized specifically for Android Tablets and mobile devices:
            - **100% Offline-First**: Built-in IndexedDB / localStorage database. Works anywhere without network.
            - **Multi-Device Real-Time Auto-Sync**: Seamlessly syncs transactions to the central desktop server over Wi-Fi or Cloudflare tunnel.
            - **Responsive Tablet UI**: Full support for landscape and portrait tablet orientations with pinch-to-zoom and hardware acceleration.
            - **Thermal & Wi-Fi Printing**: Direct print support using native Android PrintManager.
            - **Excel / CSV Exporting**: Direct download to tablet's Downloads folder.
            
            ### 📥 Direct Download:
            Download **[kanimc-tablet.apk](https://github.com/Nivash005/KANIMC-WEB-APP/releases/download/v1.0.0-tablet/kanimc-tablet.apk)** directly onto your tablet and tap to install!
          files: output/kanimc-tablet.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
