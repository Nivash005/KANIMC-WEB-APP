name: Build Android Tablet APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'src/main/resources/static/**'
      - 'index.html'
      - 'gh_pages_adapter.js'
      - 'seed_data.js'
      - 'modal_logic.js'
      - 'data/**'
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Tablet APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Sync Latest Web Assets
        run: |
          mkdir -p android/app/src/main/assets/www/data
          cp -r data/* android/app/src/main/assets/www/data/ || true
          cp -r src/main/resources/static/* android/app/src/main/assets/www/ || true
          cp index.html android/app/src/main/assets/www/index.html
          cp gh_pages_adapter.js android/app/src/main/assets/www/gh_pages_adapter.js
          cp seed_data.js android/app/src/main/assets/www/seed_data.js
          cp modal_logic.js android/app/src/main/assets/www/modal_logic.js
          cp version.json android/app/src/main/assets/www/version.json || true
          echo "Assets bundled into APK:"
          ls -la android/app/src/main/assets/www/

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare and Sign APK with Permanent Keystore
        run: |
          mkdir -p output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/kanimc-tablet.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output/kanimc-tablet.apk
          else
            echo "Error: No APK found!"
            find android/app/build/outputs -type f || true
            exit 1
          fi

          echo "Signing output/kanimc-tablet.apk with permanent keystore..."
          export ANDROID_BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android Build Tools: $ANDROID_BUILD_TOOLS"
          $ANDROID_BUILD_TOOLS/apksigner sign --ks android/kanimc.keystore --ks-pass pass:kanimc123 --ks-key-alias kanimc --key-pass pass:kanimc123 output/kanimc-tablet.apk
          $ANDROID_BUILD_TOOLS/apksigner verify -v output/kanimc-tablet.apk
          echo "APK successfully signed and verified with permanent keystore!"
          ls -la output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanimc-tablet-apk
          path: output/kanimc-tablet.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-tablet
          name: "📱 KANIMC Tablet APK (v1.0.7 Latest)"
          body: |
            ## 📱 KANIMC Tablet Application (Android APK)
            
            This APK is fully implemented for Android Tablets and mobile devices:
            - **Permanently Signed Release**: Consistent RSA 2048-bit keystore signature across all updates, ensuring smooth in-app updates without 'App not installed' errors.
            - **Current Account Period Auto-Detection**: Automatically selects active financial period (2026-2027) upon login.
            - **Offline Single DB Mode**: Clean local storage persistence without stuck pending sync badges.
            - **Complete Database Seeded Offline**: All 2,466 accounts, groups, places, items, periods, and company settings.
            
            ### 📥 Direct Download:
            Download **[kanimc-tablet.apk](https://github.com/Nivash005/KANIMC-WEB-APP/releases/download/v1.0.0-tablet/kanimc-tablet.apk)** directly onto your tablet and tap to install!
          files: output/kanimc-tablet.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
