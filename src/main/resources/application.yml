spring:
  application:
    name: kanimc-web
  datasource:
    url: jdbc:postgresql://localhost:5432/kanimc_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Automatically creates tables matching our entities for easy development
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
