<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chitta Entry - KANIMC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="window">
    <div class="window-header">
        <span>Farmer Chitta Entry (Lot Settlement)</span>
        <span>Esc - Close</span>
    </div>
    
    <div class="toolbar">
        <button id="btnNew">F2 - New</button>
        <button id="btnSave" onclick="saveChitta()">F5 - Save</button>
        <button id="btnFind">F8 - Find</button>
        <button id="btnPrint">Ctrl+P - Print</button>
    </div>

    <div class="form-header">
        <div class="form-group">
            <label>Chitta No.</label>
            <input type="text" id="chittaNo" placeholder="Auto">
        </div>
        <div class="form-group">
            <label>Date</label>
            <input type="date" id="chittaDate" value="2026-08-24">
        </div>
        <div class="form-group">
            <label>Farmer A/C Code</label>
            <input type="text" id="farmerCode" placeholder="F001">
        </div>
        <div class="form-group">
            <label>Farmer Name</label>
            <input type="text" id="farmerName" readonly style="background:#e9e9e9;">
        </div>
    </div>

    <table id="gridTable">
        <thead>
            <tr>
                <th width="5%">S.No</th>
                <th width="20%">Commodity Code</th>
                <th width="25%">Qty / Weight</th>
                <th width="25%">Rate (₹)</th>
                <th width="25%">Amount (₹)</th>
            </tr>
        </thead>
        <tbody id="gridBody">
            <!-- Rows generated by JS -->
        </tbody>
    </table>

    <div class="grid-footer">
        <div class="summary-box">
            Deductions (₹): <input type="number" id="deductions" value="0.00" onchange="calculateFooter()" style="width:100px;text-align:right;">
        </div>
        <div class="summary-box">
            Gross Amount (₹): <span id="lblGross">0.00</span>
        </div>
        <div class="summary-box" style="color:var(--header-bg)">
            Net Payable (₹): <span id="lblNet">0.00</span>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
