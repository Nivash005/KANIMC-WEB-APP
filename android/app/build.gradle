plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kanimc.tablet'
    compileSdk 34

    defaultConfig {
        applicationId "com.kanimc.tablet"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.0.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ks = file("kanimc.jks")
            if (!ks.exists()) {
                ks = file("${projectDir}/kanimc.jks")
            }
            if (!ks.exists()) {
                ks = file("${rootDir}/kanimc.jks")
            }
            if (!ks.exists()) {
                ks = file("kanimc.keystore")
            }
            if (ks.exists()) {
                storeFile ks
                storePassword "kanimc123"
                keyAlias "kanimc"
                keyPassword "kanimc123"
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ""
            debuggable true
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
